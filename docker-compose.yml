services:
  # Les 4 stations, une par conteneur. Chaque station expose son port.
  # Images publiées sur GHCR par .github/workflows/docker-publish.yml :
  #   docker compose pull && docker compose up -d      (utilise les images publiées)
  #   docker compose up -d --build                     (reconstruit en local)
  # Tags disponibles : latest, date (AAAA-MM-JJ), sha court.
  mission-silence:
    image: ghcr.io/pierromond/escape-mission-silence:latest
    build: ./EscapeGame/MissionSilence
    container_name: escape-mission-silence
    ports:
      - "3000:3000"
    restart: unless-stopped

  spectro-masked:
    image: ghcr.io/pierromond/escape-spectro-masked:latest
    build: ./EscapeGame/SpectroMasked
    container_name: escape-spectro-masked
    ports:
      - "4000:4000"
    restart: unless-stopped

  chladni:
    image: ghcr.io/pierromond/escape-chladni:latest
    build: ./EscapeGame/Chladni
    container_name: escape-chladni
    ports:
      - "4500:4500"
    restart: unless-stopped

  cri-du-vivant:
    image: ghcr.io/pierromond/escape-cri-du-vivant:latest
    build: ./EscapeGame/CriDuVivant
    container_name: escape-cri-du-vivant
    ports:
      - "8765:8765"
    restart: unless-stopped

  # Option HTTPS : décommentez et lancez avec :
  #   docker compose --profile https up -d
  # avec la variable d'environnement DOMAIN=station.example.com
  # (voir Caddyfile : sous-domaines mission.<domaine>, cri.<domaine>, ...)
  # caddy:
  #   image: caddy:2-alpine
  #   profiles: ["https"]
  #   env_file: .env.caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   restart: unless-stopped

volumes:
  caddy-data:
