name: Docker images (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "EscapeGame/**"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: escape-mission-silence
            context: EscapeGame/MissionSilence
          - image: escape-spectro-masked
            context: EscapeGame/SpectroMasked
          - image: escape-chladni
            context: EscapeGame/Chladni
          - image: escape-cri-du-vivant
            context: EscapeGame/CriDuVivant
    steps:
      - name: Date du jour
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.value }}
            type=sha,format=short

      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
